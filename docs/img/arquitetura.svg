<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <style>
      .camada { font-size: 15px; font-weight: 700; fill: #667085; letter-spacing: .08em; }
      .titulo { font-size: 18px; font-weight: 700; fill: #101828; }
      .texto { font-size: 14px; fill: #344054; }
      .rotulo { font-size: 13px; fill: #344054; }
      .forte { font-weight: 700; }
      .linha { stroke: #475467; stroke-width: 2; fill: none; marker-end: url(#seta); }
      .tracejada { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- faixas das camadas -->
  <rect x="20" y="20" width="1160" height="170" rx="14" fill="#eef4ff"/>
  <text x="40" y="48" class="camada">DISPOSITIVO (borda)</text>
  <rect x="20" y="210" width="1160" height="90" rx="14" fill="#f2f4f7"/>
  <text x="40" y="238" class="camada">REDE</text>
  <rect x="20" y="320" width="1160" height="240" rx="14" fill="#ecfdf3"/>
  <text x="40" y="348" class="camada">NUVEM</text>
  <rect x="20" y="580" width="1160" height="160" rx="14" fill="#fef6ee"/>
  <text x="40" y="608" class="camada">INTERFACE</text>

  <!-- dispositivo -->
  <rect x="60" y="66" width="250" height="104" rx="10" fill="#fff" stroke="#84adff" stroke-width="2"/>
  <text x="80" y="94" class="titulo">Sensores</text>
  <text x="80" y="120" class="texto">DHT22 — temperatura/umidade</text>
  <text x="80" y="142" class="texto">HC-SR04 — porta aberta/fechada</text>
  <text x="80" y="164" class="texto">Botão — silenciar no local</text>

  <rect x="400" y="62" width="400" height="112" rx="10" fill="#fff" stroke="#2e6be6" stroke-width="2.5"/>
  <text x="420" y="92" class="titulo">ESP32 (Wokwi) — decide na borda</text>
  <text x="420" y="118" class="texto">histerese do compressor · alarme com tempo mínimo</text>
  <text x="420" y="140" class="texto">estado seguro · buffer offline · limites na NVS</text>
  <text x="420" y="162" class="texto">verifica HMAC dos comandos · assina o histórico</text>

  <rect x="890" y="66" width="250" height="104" rx="10" fill="#fff" stroke="#84adff" stroke-width="2"/>
  <text x="910" y="94" class="titulo">Atuadores</text>
  <text x="910" y="120" class="texto">Relé — compressor</text>
  <text x="910" y="142" class="texto">Buzzer — sirene</text>
  <text x="910" y="164" class="texto">LED RGB — sinaleiro</text>

  <path d="M310,118 L398,118" class="linha"/>
  <path d="M800,118 L888,118" class="linha"/>

  <!-- rede: ESP32 -> broker -->
  <path d="M600,178 L600,388" class="linha" marker-start="url(#seta)"/>
  <rect x="612" y="236" width="340" height="48" rx="8" fill="#fff" stroke="#d0d5dd"/>
  <text x="624" y="256" class="rotulo forte">MQTT com TLS · 8883 · certificado conferido</text>
  <text x="624" y="276" class="rotulo">↑ telemetria, estado, alerta, histórico · ↓ comando</text>

  <!-- nuvem -->
  <rect x="420" y="390" width="360" height="92" rx="10" fill="#fff" stroke="#12b76a" stroke-width="2.5"/>
  <text x="440" y="418" class="titulo">EMQX Cloud (broker MQTT)</text>
  <text x="440" y="444" class="texto">usuário e senha · só portas TLS</text>
  <text x="440" y="466" class="texto">regra: tópico …/historico → HTTPS</text>

  <rect x="880" y="372" width="280" height="168" rx="10" fill="#fff" stroke="#12b76a" stroke-width="2.5"/>
  <text x="900" y="400" class="titulo">Cloudflare Worker</text>
  <text x="900" y="426" class="texto">/api/leituras (token + HMAC)</text>
  <text x="900" y="448" class="texto">/api/historico · /resumo · /eventos</text>
  <text x="900" y="470" class="texto">/api/assinar (PIN, bloqueio)</text>
  <text x="900" y="496" class="texto forte">D1: leituras, eventos (SQL)</text>
  <text x="900" y="518" class="texto forte">KV: limites, contador de PIN</text>

  <path d="M780,436 L878,436" class="linha"/>
  <text x="790" y="426" class="rotulo">HTTPS</text>
  <text x="790" y="458" class="rotulo">+ token</text>

  <!-- interface -->
  <rect x="300" y="626" width="600" height="96" rx="10" fill="#fff" stroke="#f79009" stroke-width="2.5"/>
  <text x="320" y="654" class="titulo">Painel web (navegador)</text>
  <text x="320" y="680" class="texto">estado ao vivo · gráfico 24 h · resumo por hora · alertas</text>
  <text x="320" y="702" class="texto">silenciar / cancelar silêncio / limites — só "executado" com ack</text>

  <!-- painel <-> broker (WSS) -->
  <path d="M520,624 L520,486" class="linha" marker-start="url(#seta)"/>
  <text x="505" y="540" class="rotulo forte" text-anchor="end">MQTT sobre WebSocket seguro (WSS 8084)</text>
  <text x="505" y="560" class="rotulo" text-anchor="end">↓ telemetria, estado, alerta, ack</text>
  <text x="505" y="580" class="rotulo" text-anchor="end">↑ comando assinado (HMAC)</text>

  <!-- painel <-> worker (HTTPS) -->
  <path d="M902,674 L1020,674 L1020,542" class="linha"/>
  <text x="1030" y="600" class="rotulo forte">HTTPS + PIN</text>
  <text x="1030" y="620" class="rotulo">histórico, resumo,</text>
  <text x="1030" y="640" class="rotulo">assinatura do comando</text>
</svg>
